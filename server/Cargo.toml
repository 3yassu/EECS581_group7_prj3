[package]
name = "server"
version = "0.1.0"
edition = "2024"

[lib]
name = "heychef_scraper"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
thirtyfour = "0.31.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
